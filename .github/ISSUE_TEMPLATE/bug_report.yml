name: Bug report
description: Report a reproducible issue with the AeroBase baseline.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Environment and versions
      description: Include OS, architecture, ROS 2, PX4, Gazebo, and relevant package versions.
      placeholder: Ubuntu 24.04 amd64, ROS 2 Jazzy, PX4 v1.17.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproducible steps
      description: List the commands and configuration needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Add a short, redacted log summary if it helps explain the failure. Do not upload tokens, credentials, or complete personal runtime logs.
    validations:
      required: true
